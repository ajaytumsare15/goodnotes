<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Goodnotes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f2f2f7">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self';">
  <title>Goodnotes Web</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="top-navbar">
    <div class="nav-section">
      <button id="btn-library" class="btn-icon" title="Notebooks Library">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <button id="btn-toggle-sidebar" class="btn-icon" title="Toggle Page Thumbnails">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
        </svg>
      </button>
      <div class="notebook-title-wrap">
        <input type="text" id="notebook-title-input" class="notebook-title" value="My Notebook" spellcheck="false">
      </div>
    </div>

    <!-- Page Indicator & Navigation -->
    <div class="nav-section">
      <button id="btn-prev-page" class="btn-icon" title="Previous Page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span id="page-indicator" class="page-indicator-badge">Page 1 of 1</span>
      <button id="btn-next-page" class="btn-icon" title="Next Page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <button id="btn-add-page" class="btn-icon" title="Add New Page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- Actions & Exports -->
    <div class="nav-section">
      <button id="btn-undo" class="btn-icon" title="Undo (Cmd+Z)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/>
        </svg>
      </button>
      <button id="btn-redo" class="btn-icon" title="Redo (Cmd+Shift+Z)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"/>
        </svg>
      </button>
      <div class="divider"></div>
      <button id="btn-template-picker" class="btn-icon" title="Change Paper Template">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
      </button>
      <button id="btn-export-png" class="btn-icon" title="Export Page as PNG">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
        </svg>
      </button>
      <button id="btn-export-pdf" class="btn-icon" title="Export Notebook as PDF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <button id="btn-clear-page" class="btn-icon" title="Clear Page" style="color: #ff3b30;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- GOODNOTES DOCKED TOOLBAR -->
  <nav class="goodnotes-toolbar">
    <div class="tools-group">
      <!-- Pen Tool -->
      <button id="tool-pen" class="tool-btn active" title="Pen (P)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/>
        </svg>
      </button>

      <!-- Highlighter Tool -->
      <button id="tool-highlighter" class="tool-btn" title="Highlighter (H)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l-6 6v3h3l6-6m-3-3l7-7 4 4-7 7m-4-4l4 4"/>
        </svg>
      </button>

      <!-- Eraser Tool -->
      <button id="tool-eraser" class="tool-btn" title="Stroke Eraser (E)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/><line x1="6" y1="13" x2="15" y2="4"/>
        </svg>
      </button>

      <!-- Lasso Tool -->
      <button id="tool-lasso" class="tool-btn" title="Lasso Selection (L)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 22a5 5 0 0 1-2-4c0-3.87 3.13-7 7-7h4a5 5 0 0 1 0 10h-2"/>
          <circle cx="16" cy="19" r="2"/>
        </svg>
      </button>

      <!-- Shape Tool -->
      <button id="tool-shape" class="tool-btn" title="Auto-Shapes (S)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/><polygon points="12 3 20 18 4 18"/>
        </svg>
      </button>

      <!-- Text Note Tool -->
      <button id="tool-text" class="tool-btn" title="Text Box (T)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
      </button>

      <!-- Hand Pan Tool -->
      <button id="tool-hand" class="tool-btn" title="Pan Page (Space)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
        </svg>
      </button>
    </div>

    <!-- Quick Color Slots -->
    <div class="presets-group">
      <div id="color-dot-1" class="color-dot-preset selected" style="background: #007aff;" data-color="#007aff"></div>
      <div id="color-dot-2" class="color-dot-preset" style="background: #ff3b30;" data-color="#ff3b30"></div>
      <div id="color-dot-3" class="color-dot-preset" style="background: #34c759;" data-color="#34c759"></div>
      <label class="color-dot-preset" style="background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); display: flex; align-items: center; justify-content: center;" title="Custom Color">
        <input type="color" id="custom-color-picker" class="color-picker-input" value="#007aff">
      </label>
    </div>

    <div class="divider"></div>

    <!-- Quick Thickness Slots -->
    <div class="presets-group">
      <div id="thick-pill-1" class="thickness-pill-preset selected" data-thickness="2.0" title="Fine Stroke">
        <div class="dot" style="width: 4px; height: 4px;"></div>
      </div>
      <div id="thick-pill-2" class="thickness-pill-preset" data-thickness="4.5" title="Medium Stroke">
        <div class="dot" style="width: 8px; height: 8px;"></div>
      </div>
      <div id="thick-pill-3" class="thickness-pill-preset" data-thickness="8.0" title="Bold Stroke">
        <div class="dot" style="width: 13px; height: 13px;"></div>
      </div>
    </div>
  </nav>

  <!-- MAIN WORKSPACE -->
  <main class="workspace-container">
    <!-- Collapsible Page Thumbnails Sidebar -->
    <aside id="page-sidebar" class="page-sidebar">
      <div class="sidebar-header">
        <span>Page Thumbnails</span>
        <button id="btn-sidebar-add-page" class="btn-icon" title="Add Page" style="width: 28px; height: 28px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <div id="thumbnails-list" class="thumbnails-list">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Desk Viewport with Floating Paper -->
    <section id="desk-viewport" class="desk-viewport">
      <div id="paper-container" class="paper-sheet-container">
        <!-- Layer 1: Procedural Paper Background (Lines, Grid, Dot, etc.) -->
        <canvas id="paper-background-canvas" class="paper-layer"></canvas>

        <!-- Layer 2: Interactive Vector Ink Drawing Layer -->
        <canvas id="active-drawing-canvas" class="paper-layer"></canvas>

        <!-- Lasso Selection Interactive Overlay -->
        <div id="lasso-box" class="lasso-selection-box">
          <div class="lasso-toolbar">
            <button id="btn-lasso-duplicate" class="lasso-btn">Duplicate</button>
            <button id="btn-lasso-delete" class="lasso-btn danger">Delete</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Floating Zoom HUD -->
    <div class="floating-hud">
      <button id="btn-zoom-out" title="Zoom Out">−</button>
      <span id="zoom-label">100%</span>
      <button id="btn-zoom-in" title="Zoom In">+</button>
      <button id="btn-zoom-reset" title="Reset Zoom" style="margin-left: 4px; font-size: 11px; opacity: 0.7;">Fit</button>
    </div>
  </main>

  <!-- MODAL: TEMPLATE PICKER -->
  <div id="modal-template" class="modal-backdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h2 class="modal-title">Choose Paper Template</h2>
        <button id="btn-close-template-modal" class="btn-icon">✕</button>
      </div>
      <div class="modal-body">
        <div id="template-picker-grid" class="template-grid">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: NOTEBOOKS SHELF / LIBRARY -->
  <div id="modal-notebooks" class="modal-backdrop">
    <div class="modal-window" style="width: 720px;">
      <div class="modal-header">
        <h2 class="modal-title">My Notebooks</h2>
        <div style="display: flex; gap: 8px;">
          <button id="btn-create-new-notebook" class="btn-primary">+ New Notebook</button>
          <button id="btn-close-notebooks-modal" class="btn-icon">✕</button>
        </div>
      </div>
      <div class="modal-body">
        <div id="notebooks-shelf-grid" class="notebooks-grid">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Goodnotes Offline Service Worker registered', reg.scope))
          .catch((err) => console.log('Service Worker skipped:', err));
      });
    }
  </script>
</body>
</html>
